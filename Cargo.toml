bin = [{name = "hyper-fs-fat-system", path = "src/main.rs", test = false, bench = false}]

[package]
name = "hyper-fs-fat-system"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/HypeR-Proj/fs-fat"
publish = false
autotests = false
workspace = "../../app"

[dependencies]

[dependencies.hyper-os]
workspace = true
features = ["std"]

[dependencies.hyper-rt]
workspace = true
features = ["std"]

[dependencies.hyper-service]
workspace = true

[dependencies.hyper-filesystem]
workspace = true

[dependencies.hyper-fs-service]
workspace = true

[dependencies.fatfs]
default-features = false
features = ["lfn", "unicode"]
version = "=0.4.0"
path = "../../third_party/rust-fatfs"

[lints]

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(target_os, values(\"hyper\"))"]

[lib]
name = "hyper_fs_fat"

[features]
block-queue-test = []
